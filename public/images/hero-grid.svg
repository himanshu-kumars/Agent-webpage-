<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none">
  <defs>
    <radialGradient id="obsidianGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3ee0ff" stop-opacity="0.22" />
      <stop offset="52%" stop-color="#0a1322" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#04070d" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee0ff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#39ff9d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="hudGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3ee0ff" stroke-opacity="0.09" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Frame -->
  <rect width="960" height="640" fill="#04070d" />
  <rect width="960" height="640" fill="url(#hudGrid)" />
  <circle cx="480" cy="320" r="290" fill="url(#obsidianGlow)" />

  <!-- Outer HUD Registration Frame -->
  <rect x="20" y="20" width="920" height="600" stroke="#3ee0ff" stroke-opacity="0.28" stroke-width="1" />
  <path d="M20 44 V20 H44 M916 20 H940 V44 M20 596 V620 H44 M916 620 H940 V596" stroke="#3ee0ff" stroke-width="2.5" />

  <!-- Geostationary Orbital Rings -->
  <circle cx="480" cy="320" r="245" stroke="#3ee0ff" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="480" cy="320" r="205" stroke="#3ee0ff" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="480" cy="320" r="160" stroke="#ffb454" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="10 6" />
  <circle cx="480" cy="320" r="112" stroke="#3ee0ff" stroke-opacity="0.25" stroke-width="1" />
  <circle cx="480" cy="320" r="54" stroke="#39ff9d" stroke-opacity="0.4" stroke-width="1.2" />

  <!-- Inclined Orbital Ellipses (LEO / MEO / GEO) -->
  <ellipse cx="480" cy="320" rx="275" ry="96" transform="rotate(-24 480 320)" stroke="url(#cyanArc)" stroke-width="1.6" stroke-dasharray="8 4" />
  <ellipse cx="480" cy="320" rx="275" ry="96" transform="rotate(32 480 320)" stroke="#3ee0ff" stroke-opacity="0.45" stroke-width="1.2" />
  <ellipse cx="480" cy="320" rx="210" ry="185" transform="rotate(12 480 320)" stroke="#ffb454" stroke-opacity="0.25" stroke-width="1" />

  <!-- Crosshair Axis Lines -->
  <line x1="120" y1="320" x2="840" y2="320" stroke="#3ee0ff" stroke-opacity="0.22" stroke-width="1" />
  <line x1="480" y1="45" x2="480" y2="595" stroke="#3ee0ff" stroke-opacity="0.22" stroke-width="1" />

  <!-- Ten-Agency Coalition Uplink Nodes -->
  <g stroke="#3ee0ff" stroke-width="1.5" fill="#04070d">
    <!-- CIA Langley -->
    <circle cx="310" cy="240" r="6" fill="#3ee0ff" />
    <!-- SIS London -->
    <circle cx="455" cy="195" r="6" fill="#3ee0ff" />
    <!-- R&AW New Delhi -->
    <circle cx="615" cy="278" r="6" fill="#39ff9d" />
    <!-- GCHQ Cheltenham -->
    <circle cx="440" cy="180" r="5" fill="#3ee0ff" />
    <!-- NSA Fort Meade -->
    <circle cx="325" cy="232" r="5" fill="#3ee0ff" />
    <!-- Mossad Tel Aviv -->
    <circle cx="535" cy="258" r="6" fill="#ffb454" />
    <!-- BND Berlin -->
    <circle cx="492" cy="188" r="5" fill="#3ee0ff" />
    <!-- DGSE Paris -->
    <circle cx="468" cy="206" r="5" fill="#3ee0ff" />
    <!-- ASIS Canberra -->
    <circle cx="690" cy="435" r="6" fill="#39ff9d" />
    <!-- CSIS Ottawa -->
    <circle cx="332" cy="202" r="5" fill="#3ee0ff" />
  </g>

  <!-- Inter-Station Quantum Mesh Arcs -->
  <path d="M310 240 Q380 140 455 195" stroke="#3ee0ff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M455 195 Q540 210 615 278" stroke="#39ff9d" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M615 278 Q670 355 690 435" stroke="#3ee0ff" stroke-width="1.5" stroke-opacity="0.75" />
  <path d="M310 240 Q420 290 535 258" stroke="#ffb454" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="5 3" />
  <path d="M332 202 Q410 150 492 188" stroke="#3ee0ff" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Telemetry Callout Labels -->
  <g font-family="monospace" font-size="11" fill="#3ee0ff" letter-spacing="1.4">
    <text x="42" y="52">AEGIS // ORBITAL MESH TOPOLOGY [EPOCH 2087.314]</text>
    <text x="42" y="70" fill="#8da4c4">INCLINATION: 53.2° LEO // QUANTUM KEY SYNC: LOCKED</text>
    <text x="225" y="255" fill="#e6f1ff">LANGLEY // FT. MEADE</text>
    <text x="355" y="166" fill="#e6f1ff">LONDON // CHELTENHAM</text>
    <text x="505" y="176" fill="#3ee0ff">BERLIN // PARIS</text>
    <text x="548" y="256" fill="#ffb454">TEL AVIV NODE</text>
    <text x="628" y="276" fill="#39ff9d">NEW DELHI RELAY</text>
    <text x="702" y="440" fill="#39ff9d">CANBERRA ARRAY</text>
    <text x="42" y="592" fill="#ffb454">UNOFFICIAL SPECULATIVE INTERFACE // ZERO EXTERNAL TELEMETRY</text>
    <text x="720" y="592" fill="#39ff9d">10 ALLIED DIRECTORATES ONLINE</text>
  </g>
</svg>
